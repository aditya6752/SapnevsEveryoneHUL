<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spark — Cultural Moment Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#120a26; --bg2:#1a1035; --card:#221541; --card2:#2a1b54;
    --cyan:#22D3EE; --pink:#F472B6; --mint:#34D399; --gold:#FBBF24;
    --text:#F3F1FF; --muted:#B8C0E0; --muted2:#8B93BE; --line:#3A2C6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #2a1758 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #1a2f5c 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;}
  .app{max-width:1320px;margin:0 auto;padding:22px 22px 60px;}

  /* Header */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg,var(--cyan),var(--pink));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#120a26;
    box-shadow:0 0 22px rgba(34,211,238,.35);
  }
  .brand h1{font-size:20px;margin:0;letter-spacing:.3px;}
  .brand p{margin:0;font-size:11.5px;color:var(--muted2);letter-spacing:1.4px;text-transform:uppercase;}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mint);background:rgba(52,211,153,.1);
    border:1px solid rgba(52,211,153,.35);padding:6px 12px;border-radius:20px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;}
  @media (max-width:920px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted2);margin:0 0 14px;}

  /* Signal cards */
  .signal{
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;
    cursor:pointer;transition:.15s ease;
  }
  .signal:hover{border-color:var(--cyan);transform:translateY(-1px);}
  .signal.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(251,191,36,.25);}
  .signal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .signal-brand{font-weight:700;font-size:13.5px;}
  .signal-cat{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;}
  .signal-text{font-size:11.5px;color:var(--muted);line-height:1.4;margin:6px 0 10px;}
  .bars{display:flex;gap:6px;}
  .bar-wrap{flex:1;}
  .bar-label{font-size:8.5px;color:var(--muted2);text-transform:uppercase;margin-bottom:3px;}
  .bar-track{height:4px;background:#150c30;border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}

  /* Pipeline */
  .stepper{display:flex;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:6px;}
  .step{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:9px 13px;font-size:12px;color:var(--muted2);flex:1;min-width:120px;}
  .step .num{width:22px;height:22px;border-radius:50%;background:#150c30;display:flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:700;color:var(--muted2);flex-shrink:0;transition:.2s;}
  .step.active{border-color:var(--cyan);color:var(--text);}
  .step.active .num{background:var(--cyan);color:#0b0620;box-shadow:0 0 10px rgba(34,211,238,.5);}
  .step.done .num{background:var(--mint);color:#0b0620;}
  .step.done{color:var(--text);}
  .arrow{color:var(--muted2);font-size:14px;}

  .stage{min-height:340px;}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:340px;
    color:var(--muted2);text-align:center;gap:10px;}
  .placeholder .big{font-size:34px;}

  .detail-block{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .detail-block h3{margin:0 0 8px;font-size:13.5px;color:var(--cyan);}
  .detail-block p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .score-row{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .score{text-align:left;}
  .score .num{font-size:22px;font-weight:800;}
  .score .lbl{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;}

  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
    border-top-color:var(--cyan);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;padding:14px 0;}

  .variants{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px;}
  .variant{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
  .variant:hover{border-color:var(--pink);}
  .variant.picked{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint);}
  .variant .vtag{font-size:9.5px;color:var(--pink);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:6px;}
  .variant .vcopy{font-size:12.5px;line-height:1.5;color:var(--text);margin-bottom:8px;}
  .variant .vvisual{font-size:10.5px;color:var(--muted2);font-style:italic;}

  .lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px;}
  .lang-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
  .lang-card .lname{font-size:10.5px;color:var(--mint);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:6px;}
  .lang-card .ltext{font-size:12.5px;color:var(--text);line-height:1.5;}

  .compliance{margin-top:14px;}
  .check{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);padding:6px 0;}
  .check .icon{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;margin-top:1px;}
  .icon.pass{background:rgba(52,211,153,.18);color:var(--mint);}
  .icon.warn{background:rgba(251,191,36,.18);color:var(--gold);}

  .btn{border:none;border-radius:9px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),#0ea5c4);color:#08131a;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#241300;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  .published-banner{background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(34,211,238,.08));
    border:1px solid rgba(52,211,153,.45);border-radius:12px;padding:16px 18px;margin-top:14px;}
  .published-banner h3{margin:0 0 4px;color:var(--mint);font-size:14px;}
  .published-banner p{margin:0;font-size:12px;color:var(--muted);}

  .gate-note{font-size:11px;color:var(--muted2);margin-top:8px;}

  .log{margin-top:18px;}
  .log-entry{display:flex;gap:10px;font-size:11.5px;color:var(--muted2);padding:5px 0;border-bottom:1px dashed var(--line);}
  .log-entry:last-child{border-bottom:none;}
  .log-time{color:var(--muted2);min-width:64px;}
  .log-agent{color:var(--cyan);font-weight:700;min-width:110px;}

  .err{background:rgba(244,114,182,.1);border:1px solid rgba(244,114,182,.4);color:var(--pink);
    border-radius:10px;padding:10px 14px;font-size:12px;margin-top:10px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <h1>Spark <span style="color:var(--muted2);font-weight:400;">— Cultural Moment Engine</span></h1>
        <p>Project NEXT · Unilever Techtonic S8 Prototype</p>
      </div>
    </div>
    <div class="live"><span class="dot"></span> Listening agent live · 4 signals in window</div>
  </div>

  <div class="layout">

    <!-- LEFT: signal feed -->
    <div class="panel">
      <h2>Live Signals</h2>
      <div id="signalList"></div>
    </div>

    <!-- RIGHT: pipeline -->
    <div class="panel">
      <h2>Detect → Score → Generate → Review &amp; Localize → Publish</h2>
      <div class="stepper" id="stepper"></div>
      <div class="stage" id="stage">
        <div class="placeholder">
          <div class="big">📡</div>
          <div>Select a signal on the left to run it through the pipeline.</div>
        </div>
      </div>
      <div class="log" id="logPanel" style="display:none;">
        <h2>Audit Log</h2>
        <div id="logEntries"></div>
      </div>
    </div>

  </div>
</div>

<script>
const COLORS = ['var(--cyan)','var(--pink)','var(--mint)','var(--gold)'];

const SIGNALS = [
  {
    id:'rexona', brand:'Rexona', tagline:"It won't EVER let you down",
    category:'Sports · Viral', velocity:96, relevance:91, brandFit:94,
    text:"A football referee's armband bearing the Rexona logo was caught on camera during electric stoppage time — fans have frozen the frame and it's now the tournament's top meme.",
    voice:"Confident, understated, a little wry. Never boastful — let the moment speak. Short sentences.",
    hashtag:"#TechDoneRight"
  },
  {
    id:'dove', brand:'Dove', tagline:"Real Beauty",
    category:'Beauty · Wellness', velocity:78, relevance:85, brandFit:90,
    text:"A slow-motion 'no-filter skin' trend is resurging after a celebrity posted an unfiltered morning routine — comment sections are full of people sharing their own real skin.",
    voice:"Warm, affirming, never preachy. Celebrates real skin without lecturing.",
    hashtag:"#RealBeauty"
  },
  {
    id:'knorr', brand:'Knorr', tagline:"Real, Fresh, Delicious",
    category:'Food · Lifestyle', velocity:82, relevance:74, brandFit:80,
    text:"A viral '5-ingredient pantry dump' dinner trend is spreading among home cooks facing grocery inflation — practical, resourceful, a little proud of the hustle.",
    voice:"Practical, encouraging, kitchen-table honest. Celebrates resourcefulness.",
    hashtag:"#RealFreshDelicious"
  },
  {
    id:'axe', brand:'Axe', tagline:"Find Your Magic",
    category:'Culture · Humor', velocity:70, relevance:68, brandFit:72,
    text:"A meme format joking about 'first date cologne overdose' is spreading fast among Gen Z — self-deprecating, funny, low-stakes.",
    voice:"Playful, self-aware, in on the joke. Never defensive.",
    hashtag:"#FindYourMagic"
  },
];

let state = {
  signal:null,
  step:0, // 0 idle,1 detect,2 score,3 generate,4 review,5 publish,6 published
  variants:null,
  pickedVariant:null,
  localized:null,
  compliance:null,
  log:[],
  busy:false,
  error:null,
};

function renderSignals(){
  const wrap = document.getElementById('signalList');
  wrap.innerHTML = SIGNALS.map((s,i)=>`
    <div class="signal ${state.signal && state.signal.id===s.id ? 'active':''}" onclick="selectSignal('${s.id}')">
      <div class="signal-top">
        <span class="signal-brand" style="color:${COLORS[i%4]}">${s.brand}</span>
        <span class="signal-cat">${s.category}</span>
      </div>
      <div class="signal-text">${s.text}</div>
      <div class="bars">
        ${bar('Velocity', s.velocity)}${bar('Relevance', s.relevance)}${bar('Brand Fit', s.brandFit)}
      </div>
    </div>
  `).join('');
}
function bar(label, val){
  const c = val>=88?'var(--mint)':val>=70?'var(--gold)':'var(--pink)';
  return `<div class="bar-wrap"><div class="bar-label">${label} ${val}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${val}%;background:${c}"></div></div></div>`;
}

function selectSignal(id){
  if(state.busy) return;
  state = {signal: SIGNALS.find(s=>s.id===id), step:0, variants:null, pickedVariant:null,
           localized:null, compliance:null, log:[], busy:false, error:null};
  renderSignals();
  renderStepper();
  document.getElementById('logPanel').style.display='none';
  runDetect();
}

function addLog(agent, msg){
  const t = new Date();
  const time = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  state.log.push({time, agent, msg});
  const panel = document.getElementById('logPanel');
  panel.style.display='block';
  document.getElementById('logEntries').innerHTML = state.log.slice().reverse().map(e=>`
    <div class="log-entry"><span class="log-time mono">${e.time}</span><span class="log-agent">${e.agent}</span><span>${e.msg}</span></div>
  `).join('');
}

const STEPS = ['Detect','Score','Generate','Review & Localize','Publish'];
function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s,i)=>{
    const n=i+1;
    const cls = state.step>n ? 'done' : state.step===n ? 'active' : '';
    return `<div class="step ${cls}"><span class="num">${state.step>n?'✓':n}</span>${s}</div>` +
      (i<STEPS.length-1 ? `<span class="arrow">›</span>` : '');
  }).join('');
}

async function runDetect(){
  state.step = 1; renderStepper();
  document.getElementById('stage').innerHTML = `<div class="loading-row"><span class="spinner"></span> Listening agent ingesting signal…</div>`;
  await sleep(650);
  addLog('Listening', `Captured signal for ${state.signal.brand} from social + web-scraping streams.`);
  renderDetail();
  await sleep(500);
  runScore();
}

function renderDetail(){
  document.getElementById('stage').innerHTML = `
    <div class="detail-block">
      <h3>${state.signal.brand} · ${state.signal.category}</h3>
      <p>${state.signal.text}</p>
    </div>
  `;
}

async function runScore(){
  state.step = 2; renderStepper();
  await sleep(500);
  const s = state.signal;
  addLog('Scoring', `Velocity ${s.velocity} · Relevance ${s.relevance} · Brand-fit ${s.brandFit} → routed for creative generation.`);
  renderDetail();
  document.getElementById('stage').innerHTML += `
    <div class="detail-block">
      <h3>Signal Score</h3>
      <div class="score-row">
        <div class="score"><div class="num" style="color:var(--cyan)">${s.velocity}</div><div class="lbl">Velocity</div></div>
        <div class="score"><div class="num" style="color:var(--pink)">${s.relevance}</div><div class="lbl">Relevance</div></div>
        <div class="score"><div class="num" style="color:var(--mint)">${s.brandFit}</div><div class="lbl">Brand Fit</div></div>
      </div>
    </div>
  `;
  await sleep(500);
  runGenerate();
}

async function runGenerate(){
  state.step = 3; renderStepper();
  renderDetail();
  document.getElementById('stage').innerHTML += `<div class="loading-row"><span class="spinner"></span> Creative agent drafting on-brief variants with a generative model…</div>`;
  addLog('Creative', 'Requesting 3 on-brief copy variants from the generative model.');

  const prompt = `You are the Creative Agent inside "Spark", a real-time cultural-moment marketing tool for the Unilever brand ${state.signal.brand}.
Brand tagline: "${state.signal.tagline}"
Brand voice guidance: ${state.signal.voice}
Cultural moment just detected: ${state.signal.text}

Write exactly 3 short social post variants reacting to this moment in the brand's voice. Each variant: 1-2 sentences of post copy (include the hashtag ${state.signal.hashtag} naturally), plus a one-line suggested visual direction.

Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:
{"variants":[{"tag":"short 2-3 word label","copy":"the post text","visual":"one line visual direction"},{"tag":"...","copy":"...","visual":"..."},{"tag":"...","copy":"...","visual":"..."}]}`;

  try{
    const data = await callClaude(prompt);
    const parsed = extractJSON(data);
    state.variants = parsed.variants;
    addLog('Creative', `Generated ${state.variants.length} variants for human review.`);
    renderVariants();
  }catch(e){
    showError('Creative agent could not reach the generative model: ' + e.message);
  }
}

function renderVariants(){
  document.getElementById('stage').innerHTML = `
    <div class="detail-block">
      <h3>${state.signal.brand} — pick a variant to move forward</h3>
      <p>Drafted by the Creative Agent, grounded in the brand-voice brief. A human always makes the final call.</p>
    </div>
    <div class="variants">
      ${state.variants.map((v,i)=>`
        <div class="variant" id="variant-${i}" onclick="pickVariant(${i})">
          <div class="vtag">${escapeHtml(v.tag||('Variant '+(i+1)))}</div>
          <div class="vcopy">${escapeHtml(v.copy)}</div>
          <div class="vvisual">🎬 ${escapeHtml(v.visual||'')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function pickVariant(i){
  state.pickedVariant = state.variants[i];
  document.querySelectorAll('.variant').forEach(el=>el.classList.remove('picked'));
  document.getElementById('variant-'+i).classList.add('picked');
  addLog('Human review', `Brand manager selected "${state.pickedVariant.tag}" for localization.`);
  const stage = document.getElementById('stage');
  if(!document.getElementById('localizeBtnRow')){
    const row = document.createElement('div');
    row.className='actions';
    row.id='localizeBtnRow';
    row.innerHTML = `<button class="btn btn-primary" onclick="runLocalize()">Localize this variant →</button>`;
    stage.appendChild(row);
  }
}

async function runLocalize(){
  state.step = 4; renderStepper();
  document.getElementById('stage').innerHTML += `<div class="loading-row"><span class="spinner"></span> Localization agent adapting the approved copy…</div>`;
  addLog('Localization', 'Adapting approved copy for São Paulo (pt-BR) and Mumbai (hi-IN) markets.');

  const prompt = `You are the Localization Agent inside "Spark" for the Unilever brand ${state.signal.brand}.
Approved English post copy: "${state.pickedVariant.copy}"
Brand voice guidance: ${state.signal.voice}

Localize this into two markets, keeping the brand voice and adapting cultural nuance (not a literal translation):
1. Brazilian Portuguese (São Paulo audience)
2. Hindi (Mumbai audience)

Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:
{"localized":[{"market":"São Paulo, Brazil","language":"Portuguese (BR)","copy":"..."},{"market":"Mumbai, India","language":"Hindi","copy":"..."}]}`;

  try{
    const data = await callClaude(prompt);
    const parsed = extractJSON(data);
    state.localized = parsed.localized;
    addLog('Localization', 'Localized copy ready for compliance check.');
    runCompliance();
  }catch(e){
    showError('Localization agent could not reach the generative model: ' + e.message);
  }
}

function runCompliance(){
  const allText = [state.pickedVariant.copy, ...(state.localized||[]).map(l=>l.copy)].join(' ').toLowerCase();
  const flags = [];
  const banned = ['guarantee','cure','best in the world','#1','clinically proven','100%'];
  banned.forEach(w=>{ if(allText.includes(w)) flags.push(`Contains flagged claim language: "${w}" — needs legal review.`); });
  if(!allText.includes(state.signal.hashtag.toLowerCase())) flags.push('Brand hashtag missing from one or more variants.');
  state.compliance = flags;
  addLog('Compliance', flags.length ? `${flags.length} item(s) flagged for review.` : 'No brand-safety or claims issues detected.');
  renderReview();
}

function renderReview(){
  document.getElementById('stage').innerHTML = `
    <div class="detail-block">
      <h3>Approved copy</h3>
      <p>${escapeHtml(state.pickedVariant.copy)}</p>
    </div>
    <div class="detail-block">
      <h3>Localized variants</h3>
      <div class="lang-grid">
        ${(state.localized||[]).map(l=>`
          <div class="lang-card">
            <div class="lname">${escapeHtml(l.market)} · ${escapeHtml(l.language)}</div>
            <div class="ltext">${escapeHtml(l.copy)}</div>
          </div>
        `).join('')}
      </div>
      <div class="compliance">
        ${state.compliance.length===0
          ? `<div class="check"><span class="icon pass">✓</span> No brand-safety or claims issues detected by the Compliance Agent.</div>`
          : state.compliance.map(f=>`<div class="check"><span class="icon warn">!</span>${escapeHtml(f)}</div>`).join('')}
      </div>
      <div class="actions">
        <button class="btn btn-gold" onclick="runPublish()">Approve &amp; Publish</button>
        <button class="btn btn-ghost" onclick="selectSignal(state.signal.id)">Discard &amp; restart</button>
      </div>
      <div class="gate-note">Human approval gate — nothing publishes without this click.</div>
    </div>
  `;
}

async function runPublish(){
  state.step = 5; renderStepper();
  document.getElementById('stage').innerHTML += `<div class="loading-row"><span class="spinner"></span> Publishing…</div>`;
  addLog('Orchestrator', 'Human approval received. Routing to publish across all approved markets.');
  await sleep(700);
  state.step = 6;
  const cls = document.querySelectorAll('.step');
  addLog('Orchestrator', `${state.signal.brand} moment published in 3 markets — pipeline complete.`);
  document.getElementById('stage').innerHTML = `
    <div class="detail-block">
      <h3>Approved copy</h3>
      <p>${escapeHtml(state.pickedVariant.copy)}</p>
    </div>
    <div class="published-banner">
      <h3>✓ Published across English, Portuguese (BR) and Hindi</h3>
      <p>${state.signal.brand} is live on the moment — from first signal to publish, fully human-approved.</p>
    </div>
    <div class="actions"><button class="btn btn-primary" onclick="selectSignal(state.signal.id)">Run this signal again</button></div>
  `;
  renderStepper();
  document.querySelectorAll('.step').forEach((el,i)=>{ if(i<5) el.classList.add('done'); });
}

function showError(msg){
  document.getElementById('stage').innerHTML += `<div class="err">${escapeHtml(msg)} — you can try selecting the signal again.</div>`;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function extractJSON(text){
  let t = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(t);
}

async function callClaude(promptText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: promptText }]
    })
  });
  if(!response.ok){ throw new Error('API request failed ('+response.status+')'); }
  const data = await response.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  if(!block) throw new Error('No text returned');
  return block.text;
}
